[project]
name = "dsa"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]",
]

[project.scripts]
dev = "app.cli:dev"
start = "app.cli:start"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
