[project]
name = "fast-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]",
]

[project.scripts]
dev = "app.cli:dev"
start = "app.cli:start"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
]
